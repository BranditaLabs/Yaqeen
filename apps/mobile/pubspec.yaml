name: yaqeen
description: Yaqeen (يقين) — Quran, prayer, azkar and the 365-day challenge.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  go_router: ^14.6.0
  path_drawing: ^1.0.1
  flutter_riverpod: ^2.6.1
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  geolocator: ^14.0.2
  flutter_compass: ^0.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_session: ^0.2.4
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.2.0
  wakelock_plus: ^1.5.2
  share_plus: ^12.0.2
  url_launcher: ^6.3.3
  package_info_plus: ^9.0.1
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  crypto: ^3.0.7
  app_tracking_transparency: ^2.0.7
  qr_flutter: ^4.1.0
  sentry_flutter: ^9.0.0
  home_widget: ^0.10.0
  # Firebase: push (FCM → PushService) and Analytics as the Google Ads sink (off until consent).
  # Stay on firebase_core 4.x (Firebase iOS SDK 12): SDK 13 needs gtm-session-fetcher ≥4, which
  # GoogleSignIn 9 (google_sign_in_ios) can't take — Swift packages then fail to resolve on iOS.
  # Every firebase_* package must be the release matching firebase_core 4.15.x (iOS SDK 12.19.x):
  # firebase_analytics 13 needs firebase_core 5.
  firebase_core: ^4.15.2
  firebase_messaging: ^16.7.1
  firebase_analytics: ^12.6.1
  # Ad measurement sinks (lib/core/analytics/sinks): Meta App Events, deferred init, Swift Package.
  # TikTok has no SDK in the app — server-side Events API (docs/ANALYTICS_EVENTS.md).
  facebook_app_events: ^0.31.0
  nfc_manager: 4.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # `dart run flutter_launcher_icons` and `dart run flutter_native_splash:create`
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  sentry_dart_plugin: ^3.4.0

# App icon — generated from packages/brand (see packages/brand/README.md)
flutter_launcher_icons:
  ios: true
  image_path_ios: assets/brand/launcher/AppIcon-1024.png
  image_path_ios_dark_transparent: assets/brand/launcher/AppIcon-1024-dark.png
  image_path_ios_tinted_grayscale: assets/brand/launcher/AppIcon-1024-tinted.png
  remove_alpha_ios: true
  android: true
  image_path_android: assets/brand/launcher/play-store-512.png
  adaptive_icon_background: assets/brand/launcher/ic_launcher_background.png
  adaptive_icon_foreground: assets/brand/launcher/ic_launcher_foreground.png
  adaptive_icon_monochrome: assets/brand/launcher/ic_launcher_monochrome.png

# Native splash — light porcelain + navy mark, so the hand-off to SplashScreen is seamless
flutter_native_splash:
  color: "#F7F9FC"
  image: assets/brand/launcher/android12-splash-icon.png
  android_12:
    color: "#F7F9FC"
    image: assets/brand/launcher/android12-splash-icon.png

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brand/
    - assets/quran/
    - assets/geo/
    - assets/content/

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: Jost
      fonts:
        - asset: assets/fonts/Jost-Light.ttf
          weight: 300
        - asset: assets/fonts/Jost-Regular.ttf
          weight: 400
        - asset: assets/fonts/Jost-Medium.ttf
          weight: 500
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
          weight: 400
        - asset: assets/fonts/Amiri-Bold.ttf
          weight: 700
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran-Regular.ttf
    # Brand typefaces — commercial. Un-comment when the licensed files are in assets/fonts
    # (packages/brand/fonts/README.md). Until then YqFonts.displayFallback renders.
    # - family: ZeyadaArabic
    #   fonts:
    #     - asset: assets/fonts/ZeyadaArabic-Regular.ttf
    #       weight: 400
    #     - asset: assets/fonts/ZeyadaArabic-Medium.ttf
    #       weight: 500
    #     - asset: assets/fonts/ZeyadaArabic-Bold.ttf
    #       weight: 700
    # - family: CanelaText
    #   fonts:
    #     - asset: assets/fonts/CanelaText-Regular.otf
    #       weight: 400
    #     - asset: assets/fonts/CanelaText-Medium.otf
    #       weight: 500
    #     - asset: assets/fonts/CanelaText-Bold.otf
    #       weight: 700

# Debug symbols for Sentry (obfuscated release builds). Run in CI after `flutter build … --split-debug-info=build/symbols`:
#   SENTRY_AUTH_TOKEN=… SENTRY_ORG=… dart run sentry_dart_plugin
sentry:
  project: yaqeen-app
  upload_debug_symbols: true
  upload_source_maps: false
  upload_sources: false
  symbols_path: build/symbols
  wait_for_processing: false
  log_level: error
  ignore_missing: true
