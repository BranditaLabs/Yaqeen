# Weekly dependency updates, grouped so they land as a few reviewable PRs (CI must pass to merge).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Africa/Cairo }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: pub
    directory: /apps/mobile
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Africa/Cairo }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Africa/Cairo }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/services/api, /apps/admin]
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Africa/Cairo }
