# Mobile release: signed Android App Bundle → Google Play, signed IPA → TestFlight.
# Run manually (Actions › Release mobile › Run workflow) or push a tag like `mobile-v0.1.0`.
# Secrets and one-time store setup: docs/RELEASE_MOBILE.md.
name: Release mobile

on:
  workflow_dispatch:
    inputs:
      platforms:
        description: Which stores
        type: choice
        options: [both, android, ios]
        default: both
      play_track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
  push:
    tags: ['mobile-v*']

concurrency:
  group: release-mobile-${{ github.ref }}
  cancel-in-progress: false

env:
  # Build number must only grow: the run number keeps it monotonic across both stores.
  BUILD_NUMBER: ${{ github.run_number }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}
  STORE_URL: ${{ vars.STORE_URL }}
  # The website (privacy, terms, help) — the cards host, e.g. the vanity domain.
  SITE_URL: ${{ vars.SITE_URL }}
  # Crash/error reporting (empty = off). Symbols for the obfuscated build go up with SENTRY_AUTH_TOKEN.
  SENTRY_DSN: ${{ vars.APP_SENTRY_DSN }}
  SENTRY_ORG: ${{ vars.SENTRY_ORG }}
  # Sign-in: the Google "Web application" OAuth client id of the API (the ID token's audience on
  # both platforms; also listed in the API's GOOGLE_CLIENT_IDS). Defaults to the yaqeen-eg Web client;
  # without one Google sign-in returns no ID token on Android. Apple's Services ID / callback default too.
  GOOGLE_SERVER_CLIENT_ID: ${{ vars.GOOGLE_SERVER_CLIENT_ID || '215304787392-2papc2vde7pj9j6uh7u6pgdsokff8gen.apps.googleusercontent.com' }}
  APPLE_SERVICE_ID: ${{ vars.APPLE_SERVICE_ID }}
  APPLE_REDIRECT_URI: ${{ vars.APPLE_REDIRECT_URI }}
  # Ad measurement SDKs (optional; each stays off in the app until `ads_measurement` is granted).
  # Google Ads via Firebase Analytics: 'true' once GA4 is enabled on Firebase project yaqeen-eg.
  FIREBASE_ANALYTICS: ${{ vars.FIREBASE_ANALYTICS }}
  # Meta App Events: both or neither. Compiled in as dart-defines and, on iOS, Secrets.xcconfig.
  FACEBOOK_APP_ID: ${{ secrets.FACEBOOK_APP_ID }}
  FACEBOOK_CLIENT_TOKEN: ${{ secrets.FACEBOOK_CLIENT_TOKEN }}

jobs:
  android:
    name: Google Play (${{ inputs.play_track || 'internal' }})
    if: ${{ github.event_name == 'push' || inputs.platforms != 'ios' }}
    runs-on: ubuntu-latest
    environment: production-mobile
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          API: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$PLAY" ] || missing="$missing PLAY_SERVICE_ACCOUNT_JSON"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] || missing="$missing vars.GOOGLE_SERVER_CLIENT_ID"
          [ -n "$API" ] || missing="$missing vars.API_BASE_URL"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing — see docs/RELEASE_MOBILE.md"; exit 1; fi
          if [ "${FACEBOOK_APP_ID:+1}" != "${FACEBOOK_CLIENT_TOKEN:+1}" ]; then
            echo "::error::Set both FACEBOOK_APP_ID and FACEBOOK_CLIENT_TOKEN, or neither — see docs/RELEASE_MOBILE.md"; exit 1
          fi
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Signing config (never committed)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS" | base64 -d > android/app/upload-keystore.jks
          printf 'storeFile=upload-keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$KEY_ALIAS" "$KEY_PASS" > android/key.properties
      - name: Cap Gradle memory (hosted runner has 16 GB)
        # The template's -Xmx8G + 4G metaspace plus the Kotlin daemon and R8 exhaust the runner, which then
        # gets shut down mid-build. ~/.gradle/gradle.properties overrides the project file in CI only.
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n' > ~/.gradle/gradle.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter test
      - name: Build app bundle
        run: |
          flutter build appbundle --release \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            ${STORE_URL:+--dart-define=STORE_URL="$STORE_URL"} \
            ${SITE_URL:+--dart-define=SITE_URL="$SITE_URL"} \
            ${SENTRY_DSN:+--dart-define=SENTRY_DSN="$SENTRY_DSN"} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            ${APPLE_SERVICE_ID:+--dart-define=APPLE_SERVICE_ID="$APPLE_SERVICE_ID"} \
            ${APPLE_REDIRECT_URI:+--dart-define=APPLE_REDIRECT_URI="$APPLE_REDIRECT_URI"} \
            ${FIREBASE_ANALYTICS:+--dart-define=FIREBASE_ANALYTICS="$FIREBASE_ANALYTICS"} \
            ${FACEBOOK_APP_ID:+--dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID"} \
            ${FACEBOOK_CLIENT_TOKEN:+--dart-define=FACEBOOK_CLIENT_TOKEN="$FACEBOOK_CLIENT_TOKEN"} \
            --dart-define=FLAVOR=prod
      - name: Upload debug symbols to Sentry
        env: { SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}" }
        run: |
          [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] || { echo "Sentry not configured — skipping symbols"; exit 0; }
          dart run sentry_dart_plugin --sentry-define=release="yaqeen@$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)+$BUILD_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release-${{ github.run_number }}
          path: |
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/build/symbols
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.yaqinbrand.yaqeen
          releaseFiles: apps/mobile/build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.play_track || 'internal' }}
          # While the app is still a draft in Play Console, releases must be drafts too.
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
      - name: Remove signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

  ios:
    name: TestFlight
    if: ${{ github.event_name == 'push' || inputs.platforms != 'android' }}
    runs-on: macos-latest
    environment: production-mobile
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          ASC_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          WPROFILE: ${{ secrets.IOS_WIDGET_PROFILE_NAME }}
          API: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          [ -n "$P12" ] || missing="$missing IOS_DIST_CERT_P12_BASE64"
          [ -n "$ASC_KEY" ] || missing="$missing ASC_API_PRIVATE_KEY"
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$GOOGLE_SERVER_CLIENT_ID" ] || missing="$missing vars.GOOGLE_SERVER_CLIENT_ID"
          [ -n "$WPROFILE" ] || missing="$missing IOS_WIDGET_PROFILE_NAME"
          [ -n "$API" ] || missing="$missing vars.API_BASE_URL"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing — see docs/RELEASE_MOBILE.md"; exit 1; fi
          if [ "${FACEBOOK_APP_ID:+1}" != "${FACEBOOK_CLIENT_TOKEN:+1}" ]; then
            echo "::error::Set both FACEBOOK_APP_ID and FACEBOOK_CLIENT_TOKEN, or neither — see docs/RELEASE_MOBILE.md"; exit 1
          fi
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
      - name: Download App Store provisioning profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: com.yaqinbrand.yaqeen
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - name: Download the widget extension's provisioning profile
        uses: apple-actions/download-provisioning-profiles@v7
        with:
          bundle-id: com.yaqinbrand.yaqeen.YaqeenWidget
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - name: Signing + Google / Meta ids (Secrets.xcconfig, never committed)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROFILE_NAME }}
          WPROFILE: ${{ secrets.IOS_WIDGET_PROFILE_NAME }}
          GID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
          GREV: ${{ secrets.GOOGLE_REVERSED_CLIENT_ID }}
        run: |
          # Included by Release.xcconfig; the Runner target sets no signing of its own, so these apply.
          cat > ios/Flutter/Secrets.xcconfig <<EOF
          ${GID:+GOOGLE_IOS_CLIENT_ID = $GID}
          ${GREV:+GOOGLE_REVERSED_CLIENT_ID = $GREV}
          DEVELOPMENT_TEAM = $TEAM
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE
          WIDGET_PROVISIONING_PROFILE_SPECIFIER = $WPROFILE
          FACEBOOK_APP_ID = $FACEBOOK_APP_ID
          FACEBOOK_CLIENT_TOKEN = $FACEBOOK_CLIENT_TOKEN
          EOF
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict>
              <key>com.yaqinbrand.yaqeen</key><string>$PROFILE</string>
              <key>com.yaqinbrand.yaqeen.YaqeenWidget</key><string>$WPROFILE</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Build IPA
        run: |
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --obfuscate --split-debug-info=build/symbols \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            ${STORE_URL:+--dart-define=STORE_URL="$STORE_URL"} \
            ${SITE_URL:+--dart-define=SITE_URL="$SITE_URL"} \
            ${SENTRY_DSN:+--dart-define=SENTRY_DSN="$SENTRY_DSN"} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" \
            ${APPLE_SERVICE_ID:+--dart-define=APPLE_SERVICE_ID="$APPLE_SERVICE_ID"} \
            ${APPLE_REDIRECT_URI:+--dart-define=APPLE_REDIRECT_URI="$APPLE_REDIRECT_URI"} \
            ${FIREBASE_ANALYTICS:+--dart-define=FIREBASE_ANALYTICS="$FIREBASE_ANALYTICS"} \
            ${FACEBOOK_APP_ID:+--dart-define=FACEBOOK_APP_ID="$FACEBOOK_APP_ID"} \
            ${FACEBOOK_CLIENT_TOKEN:+--dart-define=FACEBOOK_CLIENT_TOKEN="$FACEBOOK_CLIENT_TOKEN"} \
            --dart-define=FLAVOR=prod
      - name: Locate IPA
        id: ipa
        run: echo "path=apps/mobile/$(ls build/ios/ipa/*.ipa | head -1)" >> "$GITHUB_OUTPUT"
      - name: Upload debug symbols to Sentry
        env: { SENTRY_AUTH_TOKEN: "${{ secrets.SENTRY_AUTH_TOKEN }}" }
        run: |
          [ -n "$SENTRY_AUTH_TOKEN" ] && [ -n "$SENTRY_ORG" ] || { echo "Sentry not configured — skipping symbols"; exit 0; }
          dart run sentry_dart_plugin --sentry-define=release="yaqeen@$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d+ -f1)+$BUILD_NUMBER"
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-${{ github.run_number }}
          path: |
            apps/mobile/build/ios/ipa/*.ipa
            apps/mobile/build/symbols
      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v5
        with:
          app-path: ${{ steps.ipa.outputs.path }}
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_API_KEY_ID }}
          api-private-key: ${{ secrets.ASC_API_PRIVATE_KEY }}
      - name: Remove signing material
        if: always()
        run: rm -f ios/Flutter/Secrets.xcconfig "$RUNNER_TEMP/ExportOptions.plist"
