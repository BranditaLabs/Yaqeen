name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: API · Admin · Packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: yaqeen, POSTGRES_PASSWORD: yaqeen, POSTGRES_DB: yaqeen_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yaqeen" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yaqeen:yaqeen@localhost:5432/yaqeen_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        run: |
          pnpm --filter @yaqeen/api exec drizzle-kit generate --name ci_check
          git diff --exit-code -- services/api/drizzle || (echo "Run pnpm db:generate and commit the migration" && exit 1)
      - run: pnpm --filter @yaqeen/admin build

  e2e:
    name: Browser E2E (admin · site · cards)
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.56's `install --with-deps chromium` does not support yet.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: yaqeen, POSTGRES_PASSWORD: yaqeen, POSTGRES_DB: yaqeen }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yaqeen" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://yaqeen:yaqeen@localhost:5432/yaqeen_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @yaqeen/contracts build && pnpm --filter @yaqeen/admin build
      - run: pnpm --filter @yaqeen/e2e exec playwright install --with-deps chromium
      - run: pnpm --filter @yaqeen/e2e e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  mobile-build:
    name: Flutter Android build
    needs: mobile
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Cap Gradle memory (hosted runner has 16 GB)
        # The template's -Xmx8G + 4G metaspace plus the Kotlin daemon and R8 exhaust the runner, which then
        # gets shut down mid-build. ~/.gradle/gradle.properties overrides the project file in CI only.
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError\nkotlin.daemon.jvmargs=-Xmx2g\norg.gradle.workers.max=2\n' > ~/.gradle/gradle.properties
      - run: flutter pub get
      - run: flutter gen-l10n
      - name: Fixed test signing key (Google sign-in needs a registered SHA)
        # Without it the runner makes a fresh debug key every run, whose SHA Firebase doesn't know, so
        # Google sign-in can't work in the test APK. The key's SHA-1/256 are registered on the yaqeen-eg
        # Android app (docs/RELEASE_MOBILE.md › Test APK). Never used for store builds. Passed through
        # key.properties: the runner's Gradle ignored a key dropped at ~/.android/debug.keystore.
        env:
          KEY: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY" ]; then
            echo "$KEY" | base64 -d > "$RUNNER_TEMP/test.keystore"
            printf 'storeFile=%s\nstorePassword=android\nkeyAlias=androiddebugkey\nkeyPassword=android\n' "$RUNNER_TEMP/test.keystore" > android/key.properties
            echo "signing with the test key"
          else echo "::warning::ANDROID_TEST_KEYSTORE_BASE64 not set — Google sign-in won't work in this APK"; fi
      # Release mode (R8 shrinking, obfuscation) signed with the debug key when no key.properties exists:
      # proves manifest, Gradle, desugaring, R8 rules and plugin wiring. Store signing is in release-mobile.yml.
      # The installable test APK talks to staging (production has no hosts yet).
      - run: >-
          flutter build apk --release --obfuscate --split-debug-info=build/symbols
          --dart-define=API_BASE_URL=https://api-staging.yaqeenarabia.com
          --dart-define=SITE_URL=https://api-staging.yaqeenarabia.com
          --dart-define=APPLE_REDIRECT_URI=https://api-staging.yaqeenarabia.com/v1/auth/apple/callback
          --dart-define=FLAVOR=staging
      - name: Test APK carries the registered key
        env:
          KEY: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          [ -z "$KEY" ] && exit 0
          signer="$(ls -d "$ANDROID_HOME"/build-tools/* | tail -1)/apksigner"
          sha=$("$signer" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -m1 'SHA-1 digest' | awk '{print $NF}')
          [ "$sha" = 8c9bdf8f593d5c948097b602dde1504deb865654 ] || { echo "::error::APK signed with $sha, not the test key registered in Firebase"; exit 1; }
      # Installable test build (debug-signed, so it sideloads but can't go to Play): Actions › this run › Artifacts.
      - uses: actions/upload-artifact@v7
        with:
          name: yaqeen-android-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error

  mobile-smoke:
    name: Android release smoke (emulator)
    needs: mobile-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: yaqeen-android-apk, path: build/apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The exact APK testers install (R8, obfuscated): launches it and waits for the first Flutter frame.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash apps/mobile/tool/smoke_android.sh build/apk/app-release.apk build/smoke.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-smoke-screenshot
          path: build/smoke.png
          retention-days: 14
          if-no-files-found: ignore

  mobile-ios:
    name: Flutter iOS build (no codesign)
    needs: mobile
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: cp ios/Flutter/Secrets.example.xcconfig ios/Flutter/Secrets.xcconfig
      - run: flutter build ios --no-codesign --debug

  deploy-config:
    name: Deploy config (kustomize, scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Render every overlay
        run: |
          for d in deploy/k8s deploy/k8s/overlays/staging deploy/k8s/overlays/production deploy/k8s/monitoring; do
            echo "::group::$d"; kubectl kustomize "$d" > /dev/null && echo "ok $d"; echo "::endgroup::"
          done
      - name: Scripts parse
        run: for f in tools/deploy/deploy.sh tools/synthetics/check.sh; do bash -n "$f"; done
      - name: Dashboard JSON
        run: python3 -m json.tool deploy/k8s/monitoring/dashboards/yaqeen-api.json > /dev/null

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: API image
        uses: docker/build-push-action@v7
        with: { context: ., file: services/api/Dockerfile, push: false, tags: "yaqeen-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Admin image
        uses: docker/build-push-action@v7
        with: { context: ., file: apps/admin/Dockerfile, push: false, tags: "yaqeen-admin:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
