name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: API · Admin · Packages
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: yaqeen, POSTGRES_PASSWORD: yaqeen, POSTGRES_DB: yaqeen_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U yaqeen" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://yaqeen:yaqeen@localhost:5432/yaqeen_test
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Migrations are in sync with the schema
        run: |
          pnpm --filter @yaqeen/api exec drizzle-kit generate --name ci_check
          git diff --exit-code -- services/api/drizzle || (echo "Run pnpm db:generate and commit the migration" && exit 1)
      - run: pnpm --filter @yaqeen/admin build

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  mobile-build:
    name: Flutter Android build
    needs: mobile
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      # Debug-signed: proves manifest, Gradle, desugaring and plugin wiring; release signing is in the store pipeline.
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.yaqin-brand.com

  mobile-ios:
    name: Flutter iOS build (no codesign)
    needs: mobile
    runs-on: macos-latest
    defaults: { run: { working-directory: apps/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: cp ios/Flutter/Secrets.example.xcconfig ios/Flutter/Secrets.xcconfig
      - run: flutter build ios --no-codesign --debug

  images:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: API image
        uses: docker/build-push-action@v6
        with: { context: ., file: services/api/Dockerfile, push: false, tags: "yaqeen-api:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
      - name: Admin image
        uses: docker/build-push-action@v6
        with: { context: ., file: apps/admin/Dockerfile, push: false, tags: "yaqeen-admin:ci", cache-from: type=gha, cache-to: "type=gha,mode=max" }
