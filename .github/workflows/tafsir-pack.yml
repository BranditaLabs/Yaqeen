# Builds the tafsir pack (spec §6.6, §10) from QuranEnc.com on a GitHub runner, verifies all 6,236
# ayat, and keeps the pack as a run artifact. The text is never committed. Host the file, then set
# the TAFSIR_PACK_* values printed in the run summary (see services/api/.env.example).
name: Tafsir pack

on:
  workflow_dispatch:
    inputs:
      key:
        description: QuranEnc translation key (empty = discover the Arabic Muyassar)
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Build and verify
        env:
          KEY: ${{ inputs.key }}
        run: python3 -I tools/tafsir/build_pack.py --out build/packs ${KEY:+--key "$KEY"}
      - name: Summary
        run: |
          meta=$(ls build/packs/*.meta.json | head -1)
          {
            echo '### Tafsir pack'
            echo '```json'; cat "$meta"; echo '```'
            echo 'Host the `.json` file, then set `TAFSIR_PACK_URL`, `TAFSIR_PACK_SHA256`, `TAFSIR_PACK_SIZE`,'
            echo '`TAFSIR_PACK_VERSION` and `TAFSIR_SOURCE_VERSION` from the values above and run `pnpm db:seed`.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: tafsir-pack
          path: build/packs/
          retention-days: 90
          if-no-files-found: error
