# Local development: `docker compose up -d` then `pnpm db:migrate && pnpm db:seed`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yaqeen
      POSTGRES_PASSWORD: yaqeen
      POSTGRES_DB: yaqeen
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yaqeen"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Optional: run the API in a container instead of `pnpm dev:api`
  api:
    profiles: ["api"]
    build: { context: ., dockerfile: services/api/Dockerfile }
    env_file: services/api/.env
    environment:
      DATABASE_URL: postgres://yaqeen:yaqeen@postgres:5432/yaqeen
      REDIS_URL: redis://redis:6379
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

volumes:
  pgdata:
