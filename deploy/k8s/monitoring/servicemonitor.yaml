# Scrape the API's /metrics on the internal `metrics` port (route templates + status only, no user data).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: yaqeen-api
  labels: { release: kube-prometheus-stack }
spec:
  selector: { matchLabels: { app: yaqeen-api } }
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
