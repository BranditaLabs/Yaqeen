# Monitoring for Yaqeen — needs the Prometheus Operator CRDs (kube-prometheus-stack) and, for the
# uptime probes, a blackbox exporter. Apply after the app:  kubectl apply -k deploy/k8s/monitoring
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: yaqeen
resources:
  - servicemonitor.yaml
  - alerts.yaml
  - probes.yaml
configMapGenerator:
  # Picked up by the Grafana sidecar (label grafana_dashboard=1).
  - name: yaqeen-grafana-dashboard
    files: [yaqeen-api.json=dashboards/yaqeen-api.json]
    options:
      labels: { grafana_dashboard: "1" }
      disableNameSuffixHash: true
