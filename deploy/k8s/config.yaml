# Non-secret settings. Secrets (DATABASE_URL, REDIS_URL, JWT_SECRET, ADMIN_JWT_SECRET, ADMIN_SECRETS_KEY,
# SHOPIFY_ADMIN_TOKEN, SHOPIFY_WEBHOOK_SECRET, FIREBASE_SERVICE_ACCOUNT_JSON, GOOGLE_CLIENT_IDS, APPLE_CLIENT_IDS) live in
# the `yaqeen-api-secrets` Secret, created from your secret manager — never committed:
#   kubectl -n yaqeen create secret generic yaqeen-api-secrets --from-env-file=prod.env
apiVersion: v1
kind: ConfigMap
metadata:
  name: yaqeen-api-config
data:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGINS: https://admin.yaqin-brand.com
  HIJRI_REGION: EG
  SHOPIFY_API_VERSION: "2025-10"
  # Per pod. Pods × PG_POOL_MAX must stay under what Postgres (or PgBouncer) accepts:
  # 30 pods × 20 = 600 → run PgBouncer in transaction mode. See docs/OPERATIONS.md › Database.
  PG_POOL_MAX: "20"
  PG_STATEMENT_TIMEOUT_MS: "10000"
  RATE_LIMIT_PER_MIN: "300"
  MAX_EVENT_LOOP_DELAY_MS: "1000"
  SHUTDOWN_GRACE_MS: "15000"
  # Prometheus scrape port (Service port `metrics`, never exposed by the ingress). See deploy/k8s/monitoring.
  METRICS_PORT: "9100"
  # Errors only by default; raise to sample performance traces (0.05 = 5 %).
  SENTRY_TRACES_SAMPLE_RATE: "0"
